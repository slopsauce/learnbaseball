name: deploy

on:
  push: { branches: [main] }
  # Sans ce declencheur, une demande de fusion n'etait validee par rien : lint,
  # tests et build ne tournaient qu'APRES la fusion, donc au moment meme ou ils
  # deployaient. Les demandes de Dependabot arrivaient ainsi sans un seul
  # controle — precisement celles qu'on veut voir vertes avant de fusionner.
  pull_request: { branches: [main] }
  workflow_dispatch:
  # Surveillance quotidienne du contrat avec l'API de MLB : elle n'est ni
  # documentee ni garantie, et peut changer sans qu'on pousse quoi que ce soit.
  #
  # 06h37 UTC et non 06h00 : GitHub met les taches planifiees en file d'attente
  # et l'heure ronde est le creneau le plus dispute. Mesure sur cinq jours a
  # « 0 6 », le declenchement reel arrivait entre 08h21 et 09h46 UTC, soit deux
  # a quatre heures de retard. Une minute decalee sort du pic.
  #
  # GitHub desactive par ailleurs les taches planifiees apres 60 jours sans
  # activite sur le depot, et sans le dire.
  schedule:
    - cron: "37 6 * * *"

permissions: { contents: read, pages: write, id-token: write }
# Groupe par reference et non global : sans le suffixe, le passage d'une
# demande de fusion entrait dans la meme file que « pages » et annulait, via
# `cancel-in-progress`, un deploiement de `main` en cours.
# Les guillemets ne sont pas decoratifs : les accolades de « ${{ }} » ferment
# la table YAML en ligne et rendent tout le fichier invalide sans eux.
concurrency: { group: "pages-${{ github.ref }}", cancel-in-progress: true }

jobs:
  build:
    # Le passage planifie reconstruit lui aussi, depuis que le site publie le
    # calendrier de l'apres-saison : c'est ce passage qui va rechercher les
    # equipes et les horaires que la ligue vient d'annoncer. Sans lui, le
    # fichier ne changerait qu'au gre des poussees de code.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci

      # Le linteur d'abord : il est instantane et attrape des fautes que ni les
      # tests ni le build ne voient — un `className` declare deux fois, un
      # `useEffect` sans dependances.
      - run: npm run lint

      # Bloque le deploiement si un test echoue. `npm run build` seul laisserait
      # passer une page blanche : empaqueter n'est pas executer.
      - run: npm test

      - run: npm run build

      # Le calendrier auquel on s'abonne. Apres le build, et non pendant :
      # `npm run build` reste ainsi hors ligne, et une panne de MLB ne fait
      # pas rougir une demande de fusion. En echec, l'etape se contente de
      # reprendre le fichier deja en ligne — un abonnement qui renvoie 404
      # inquiete les clients, une version d'hier non.
      - name: calendrier de l'apres-saison
        run: |
          npm run ical || curl -fsS -o dist/apres-saison.ics \
            https://slopsauce.github.io/learnbaseball/apres-saison.ics || true

      # Preparer l'artefact Pages n'a de sens que si un deploiement suit. Sur
      # une demande de fusion il ne sert a rien, et il echouerait : GitHub
      # rabat le jeton des demandes de Dependabot en lecture seule, `pages:
      # write` comprise. Ce sont donc ces deux etapes qui feraient rougir la
      # demande qu'on cherche justement a valider.
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with: { path: dist }

  deploy:
    # Tout sauf les demandes de fusion. La forme precedente etait une liste
    # blanche — nommer ce qui deploie plutot que ce qui ne deploie pas — mais
    # le passage planifie doit desormais mettre en ligne, lui aussi : c'est
    # lui qui rafraichit le calendrier. Reste la seule exclusion qui compte,
    # et elle est explicite : jamais le contenu d'une demande de fusion.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v5

  # Ce job a le droit d'echouer bruyamment : `deploy` depend de `build`, pas de
  # lui, donc une rupture d'API ne bloque aucune mise en ligne. En revanche son
  # echec marque le run en rouge et declenche une notification — ce que
  # `continue-on-error` aurait justement supprime.
  #
  # Il ne tourne QUE sur le passage planifie (ou a la demande). Sans ce filtre
  # il partait a chaque push : une quinzaine d'appels reels a MLB pour surveiller
  # un contrat qui ne change pas parce qu'on a pousse du CSS — et, le cron etant
  # reste commente depuis son introduction, la surveillance quotidienne qu'il
  # decrit n'avait en fait jamais tourne une seule fois.
  contrat-api:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test:api
